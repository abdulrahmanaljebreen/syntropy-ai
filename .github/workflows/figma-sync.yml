name: Figma sync

# Nightly at 01:00 Riyadh (22:00 UTC) and on demand. Reads the Syntropy and Icons Figma files
# directly (every component and icon, published or not), rebuilds the doc-page guides and the
# skills' bundled data, and opens a pull request when the knowledge really changed.
# Variables are refreshed separately through the Figma plugin connection (see knowledge/tokens/source).
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force_images:
        description: Re-export every example image
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
      SYNTROPY_PRIVATE_NAMES: ${{ secrets.SYNTROPY_PRIVATE_NAMES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MCP dependencies
        run: npm ci --prefix mcp
      - name: Components
        id: components
        run: |
          out=$(node scripts/sync-figma.mjs --refresh --if-changed)
          echo "$out"
          if echo "$out" | grep -q "No Figma changes"; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Icons
        run: node scripts/sync-icons.mjs --refresh
      - name: Example images
        if: steps.components.outputs.changed == 'true' || inputs.force_images
        run: node scripts/export-images.mjs ${{ inputs.force_images && '--force' || '' }}
      - name: Guides from the doc pages
        if: steps.components.outputs.changed == 'true'
        run: node scripts/build-docs.mjs
      - name: Bundle data into the skills
        run: node scripts/build-skills.mjs
      - name: Tests
        run: npm test
      - name: Drop timestamp-only changes
        run: |
          real=$(git diff -U0 | { grep -E '^[+-][^+-]' || true; } | sed -E 's/^[+-]//; s/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}(\.[0-9]+)?Z//g' | sort | uniq -u | wc -l)
          if [ "$real" -eq 0 ] && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Only timestamps changed; no pull request."
            git checkout -- .
          fi
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/figma
          delete-branch: true
          title: 'Figma sync: knowledge update'
          commit-message: 'chore: sync knowledge from Figma'
          body: |
            Automatic sync from the Syntropy Figma files.
            Review the component and icon manifest diffs before merging.
          labels: figma-sync
