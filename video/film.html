<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<title>Syntropy for AI</title>
<style>html,body{margin:0;background:#f9faf9}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="core.js"></script>
<script>
'use strict';
/* Syntropy for AI · launch and how-to film
 * One canvas, deterministic: window.__seek(t) draws frame t. No music, no voice:
 * Arabic captions on screen, interface sound effects from window.__events,
 * subtitles from window.__captions (render.mjs writes the .srt files and the audio).
 */
const q = new URLSearchParams(location.search);
const META = { fps: 30, duration: 186, width: +q.get('w') || 1920, height: +q.get('h') || 1080 };
const cv = document.getElementById('c'); cv.width = META.width; cv.height = META.height;
setFrame(cv.getContext('2d'), META.width, META.height, META.fps);
const S = W / 1920;                       // everything is laid out on a 1920 x 1080 grid
const EV = [];                            // sound events {t, type, gain}
const CAPS = [];                          // captions {t0, t1, ar, en, draw}
const SCENES = [];
const ev = (t, type, gain = 1) => EV.push({ t, type, gain });
const cap = (t0, t1, ar, en, draw = true) => CAPS.push({ t0, t1, ar, en, draw });
function scene(name, t0, t1, chapter, setup) { SCENES.push({ name, t0, t1, chapter, draw: setup(t0, t1) }); }

/* ── shared pieces ─────────────────────────────────────────────────────── */
const EX = '../knowledge/examples/components/';
const CROPS = {
  appbar:  { img: 'appbar',  crop: [980, 160, 253, 120], name: 'AppBar' },
  carddeal:{ img: 'carddeal',crop: [46, 786, 348, 77],   name: 'CardDeal' },
  stat:    { img: 'stat',    crop: [205, 478, 140, 85],  name: 'Stat' },
  payouts: { img: 'payouts', crop: [8, 94, 186, 50],     name: 'Payouts cell' },
  button:  { img: 'button',  crop: [382, 1398, 212, 58], name: 'Button' },
};

function chapterLabel(n, label, a) {
  withAlpha(a, () => {
    const x = W - M, y = M;
    circle(x - 22, y + 22, 22, { fill: C.brand });
    text(String(n), x - 22, y + 23, { size: 24, weight: 600, color: C.base, align: 'center', baseline: 'middle', dir: 'ltr' });
    text(label, x - 58, y + 33, { size: 32, weight: 600, color: C.ink });
  });
}

function phone(x, y, w, h) {
  rr(x, y, w, h, 54, { fill: C.ink, shadow: 40 });
  rr(x + 12, y + 12, w - 24, h - 24, 44, { fill: C.surface });
}

/* the Syntropy payout screen, local coordinates, screen width 356 */
const SW = 356;
const SLOT = {
  appbar: { x: 0, y: 40, w: 356, h: 64 },
  carddeal: { x: 16, y: 112, w: 324, h: 80 },
  stat: { x: 16, y: 208, w: 324, h: 96 },
  payouts: { x: 16, y: 352, w: 324, h: 244 },
  button: { x: 16, y: 668, w: 324, h: 56 },
};
const ROWS = [
  { t: 'توزيع دوري 1', d: '15 أبريل 2026', a: '1,210.00 ر.س', s: 'تم الاستلام', ok: true },
  { t: 'توزيع دوري 2', d: '15 يوليو 2026', a: '1,210.00 ر.س', s: 'تم الاستلام', ok: true },
  { t: 'توزيع دوري 3', d: '15 يناير 2027', a: '1,210.00 ر.س', s: 'متوقع', ok: false },
];
function payoutScreen(P) {
  const R = SW - 16;
  withAlpha(P.chrome ?? 1, () => text('9:41', R - 8, 30, { size: 15, weight: 600, dir: 'ltr' }));
  withAlpha(P.appbar ?? 0, () => {
    arrow(R - 10, 72, 20, 1, { lw: 2.4 });
    text('تفاصيل التوزيعات', SW / 2, 80, { size: 22, weight: 600, align: 'center' });
  });
  withAlpha(P.carddeal ?? 0, () => {
    const s = SLOT.carddeal;
    rr(s.x, s.y, s.w, s.h, 16, { fill: C.base, stroke: C.border, lw: 1.5 });
    rr(s.x + s.w - 68, s.y + 12, 56, 56, 12, { fill: C.lg200 });
    for (let i = 0; i < 4; i++) rr(s.x + s.w - 58 + i * 10, s.y + 30 - i * 3, 7, 30 + i * 3, 1.5, { fill: C.brandDark, alpha: 0.55 });
    text('بروج الرياض', s.x + s.w - 80, s.y + 34, { size: 19, weight: 600 });
    text(`نسبة العائد ${L('12.0%')} · 12 شهرًا`, s.x + s.w - 80, s.y + 60, { size: 14, color: C.muted });
    arrow(s.x + 22, s.y + 40, 14, -1, { lw: 2, color: C.muted });
  });
  withAlpha(P.stat ?? 0, () => {
    const s = SLOT.stat;
    text('إجمالي التوزيعات المستلمة', R, s.y + 18, { size: 16, color: C.muted });
    text('2,420.00 ر.س', R, s.y + 62, { size: 34, weight: 700 });
    text(`نسبة صافي العائد المتوقع ${L('12.5%')}`, R, s.y + 90, { size: 14, color: C.subtle });
  });
  withAlpha(P.section ?? 0, () => {
    text('الدفعات', R, 336, { size: 18, weight: 600 });
    text('3 دفعات', 16, 336, { size: 14, color: C.subtle, align: 'left' });
  });
  ROWS.forEach((r, i) => withAlpha((P.rows || [0, 0, 0])[i], () => {
    const y = 352 + i * 84;
    rr(16, y, 324, 76, 16, { fill: C.elevated });
    if (r.ok) { circle(R - 22, y + 38, 13, { fill: C.successBg }); check(R - 22, y + 38, 14, { color: C.successIcon, lw: 2.2 }); }
    else { circle(R - 22, y + 38, 12, { stroke: C.borderStrong, lw: 1.8 }); line(R - 22, y + 38, R - 22, y + 31, { color: C.muted, lw: 1.8 }); line(R - 22, y + 38, R - 17, y + 41, { color: C.muted, lw: 1.8 }); }
    text(r.t, R - 46, y + 33, { size: 17, weight: 600 });
    text(r.d, R - 46, y + 57, { size: 13, color: C.muted });
    text(r.a, 32, y + 33, { size: 17, weight: 600, align: 'left', color: r.ok ? C.success : C.ink });
    text(r.s, 32, y + 57, { size: 13, align: 'left', color: r.ok ? C.success : C.subtle });
  }));
  withAlpha(P.note ?? 0, () => text('العوائد المتوقعة غير مضمونة', SW / 2, 632, { size: 13, color: C.subtle, align: 'center' }));
  withAlpha(P.button ?? 0, () => {
    const s = SLOT.button;
    rr(s.x, s.y, s.w, s.h, 12, { fill: C.brand });
    text('إعادة الاستثمار', SW / 2, s.y + 36, { size: 19, weight: 600, color: C.base, align: 'center' });
  });
}
/* the off-brand screen an agent makes without Syntropy (deliberately wrong colors) */
function offBrandScreen() {
  const serif = 'Georgia, serif';
  text('9:41', 24, 30, { size: 15, weight: 600, dir: 'ltr', align: 'left', family: 'Helvetica' });
  text('Payouts', 20, 86, { size: 32, weight: 700, dir: 'ltr', align: 'left', family: serif, color: '#1e1b4b' });
  ctx.save();
  const g = ctx.createLinearGradient(16, 110, 340, 240); g.addColorStop(0, '#7c3aed'); g.addColorStop(1, '#2563eb');
  rrPath(16, 110, 324, 130, 6); ctx.globalAlpha = A; ctx.fillStyle = g; ctx.fill(); ctx.restore();
  text('Total earned', 34, 148, { size: 15, dir: 'ltr', align: 'left', family: 'Helvetica', color: '#e9d5ff' });
  text('$2,420', 34, 200, { size: 40, weight: 700, dir: 'ltr', align: 'left', family: serif, color: '#ffffff' });
  rr(196, 254, 144, 30, 15, { fill: '#ef4444' });
  text('Only 2 days left!', 268, 274, { size: 13, weight: 700, dir: 'ltr', align: 'center', family: 'Helvetica', color: '#fff' });
  for (let i = 0; i < 4; i++) {
    const y = 306 + i * 74;
    rr(16, y, 324, 62, 4, { fill: '#ffffff', stroke: '#d4d4d8', lw: 1 });
    circle(42, y + 31, 12, { fill: '#c4b5fd' });
    rr(64, y + 18, 120, 10, 3, { fill: '#a1a1aa' }); rr(64, y + 36, 80, 8, 3, { fill: '#d4d4d8' });
    rr(270, y + 22, 54, 14, 3, { fill: '#6366f1' });
  }
  rr(16, 668, 324, 56, 4, { fill: '#2563eb' });
  text('Reinvest now!', 178, 703, { size: 19, weight: 700, dir: 'ltr', align: 'center', family: 'Helvetica', color: '#fff' });
}
function inScreen(x, y, w, fn) {   // draw local screen content into a phone screen at x,y of width w
  const k = w / SW;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k); fn(); ctx.restore();
}
function terminal(x, y, w, h, title) {
  rr(x, y, w, h, 20, { fill: C.ink, shadow: 30 });
  [0, 1, 2].forEach(i => circle(x + 32 + i * 26, y + 30, 7, { fill: C.dBorder }));
  text(title, x + w / 2, y + 37, { size: 20, color: C.dSubtle, align: 'center', dir: 'ltr', family: MONO });
  line(x, y + 60, x + w, y + 60, { color: C.dBorder, lw: 1.5 });
}
function prompt(str, x, y, o = {}) {
  const { size = 30, t = 0, caret = false, color = C.dInk, sign = '>' } = o;
  text(sign, x, y, { size, family: MONO, dir: 'ltr', align: 'left', color: C.dBrand, weight: 600 });
  const off = tw(sign + ' ', size, 400, MONO, 'ltr');
  const w = text(str, x + off, y, { size, family: MONO, dir: 'ltr', align: 'left', color });
  if (caret && caretOn(t)) rr(x + off + w + 4, y - size * 0.8, size * 0.55, size, 2, { fill: C.dInk, alpha: 0.85 });
}

/* ═════════ 1 · opening 0-8 ═════════ */
scene('open', 0, 8, null, (t0, t1) => {
  ev(0.25, 'whoosh', 0.55); ev(1.85, 'chime', 0.7);
  cap(1.6, 7.6, 'سينتروبي للذكاء الاصطناعي\nنظام تصميم صفقة، داخل أي وكيل ذكاء اصطناعي', 'Syntropy for AI\nThe Safqah design system, inside any AI agent.', false);
  return t => {
    const p = ein(t, 0.4, 1.1);
    const size = 176, word = 'Syntropy';
    const ww = tw(word, size, 600, AR, 'ltr');
    withAlpha(p, () => text(word, W / 2, 470 + (1 - p) * 24, { size, weight: 600, align: 'center', dir: 'ltr' }));
    const rp = easeInOutCubic(span(t, 0.7, 1.9));
    if (rp > 0) {
      ctx.save();
      const g = ctx.createLinearGradient(W / 2 - ww / 2, 0, W / 2 + ww / 2, 0);
      g.addColorStop(0, RAMP[0]); g.addColorStop(0.5, RAMP[1]); g.addColorStop(1, RAMP[2]);
      rrPath(W / 2 - ww / 2, 512, ww * rp, 12, 6); ctx.globalAlpha = A; ctx.fillStyle = g; ctx.fill(); ctx.restore();
    }
    withAlpha(ein(t, 1.6, 0.6), () => text('سينتروبي للذكاء الاصطناعي', W / 2, 640, { size: 64, weight: 600, align: 'center' }));
    withAlpha(ein(t, 2.6, 0.6), () => text('نظام تصميم صفقة، داخل أي وكيل ذكاء اصطناعي', W / 2, 724, { size: 46, color: C.muted, align: 'center' }));
  };
});

/* ═════════ 2 · the idea 8-23 ═════════ */
scene('idea', 8, 23, null, (t0, t1) => {
  cap(8.5, 13.4, 'الوكلاء يصمّمون بسرعة، لكن بعيدًا عن صفقة.', 'Agents design fast, but far from Safqah.');
  cap(14.2, 22.5, 'الآن يعرف كل وكيل سينتروبي: الرموز والمكوّنات وقواعد التجربة.', 'Now every agent knows Syntropy: tokens, components and UX rules.');
  const issues = ['ألوان وخطوط عشوائية', 'اتجاه من اليسار إلى اليمين', 'استعجال مصطنع'];
  issues.forEach((_, i) => ev(10.0 + i * 0.6, 'blip', 0.5));
  ev(13.75, 'whoosh', 0.4);
  const tiles = [['346', 'رمز تصميم'], ['320', 'مجموعة مكوّنات'], ['85', 'دليل مكوّن'], ['636', 'أيقونة']];
  tiles.forEach((_, i) => ev(15.2 + i * 0.45, 'pop', 0.6));
  const PX = 380, PY = 104, PW = 380, PH = 772;
  return t => {
    const pa = ein(t, 8.4, 0.6);
    withAlpha(pa, () => {
      ctx.save(); ctx.translate(0, (1 - pa) * 30);
      phone(PX, PY, PW, PH);
      const sx = PX + 12, sy = PY + 12, sw = PW - 24, sh = PH - 24;
      const wp = easeInOutCubic(span(t, 13.8, 14.9));     // RTL wipe: Syntropy comes in from the right
      ctx.save(); rrPath(sx, sy, sw, sh, 44); ctx.clip();
      if (wp < 1) { ctx.save(); ctx.beginPath(); ctx.rect(sx, sy, sw * (1 - wp), sh); ctx.clip(); rr(sx, sy, sw, sh, 0, { fill: '#ffffff' }); inScreen(sx, sy, sw, offBrandScreen); ctx.restore(); }
      if (wp > 0) {
        ctx.save(); ctx.beginPath(); ctx.rect(sx + sw * (1 - wp), sy, sw * wp, sh); ctx.clip();
        rr(sx, sy, sw, sh, 0, { fill: C.surface });
        inScreen(sx, sy, sw, () => payoutScreen({ appbar: 1, carddeal: 1, stat: 1, section: 1, rows: [1, 1, 1], note: 1, button: 1 }));
        ctx.restore();
        if (wp < 1) line(sx + sw * (1 - wp), sy, sx + sw * (1 - wp), sy + sh, { color: C.brand, lw: 4 });
      }
      ctx.restore(); ctx.restore();
    });
    const R = W - M;
    // phase 1: the problem
    withAlpha(ein(t, 9.0) * eout(t, 14.2), () => {
      chip('بعيد عن صفقة', R, 196, { size: 32, fill: C.warnBg, stroke: C.warnBorder, color: C.warnText, weight: 600 });
      issues.forEach((s, i) => withAlpha(ein(t, 10.0 + i * 0.6), () => {
        const y = 360 + i * 110;
        circle(R - 26, y - 12, 26, { fill: C.errorBg });
        line(R - 35, y - 21, R - 17, y - 3, { color: C.error, lw: 3 }); line(R - 17, y - 21, R - 35, y - 3, { color: C.error, lw: 3 });
        text(s, R - 76, y, { size: 44, weight: 500 });
      }));
    });
    // phase 2: Syntropy inside
    withAlpha(ein(t, 14.4), () => {
      chip('بنظام سينتروبي', R, 196, { size: 32, fill: C.lg100, stroke: C.lg300, color: C.brandDark, weight: 600 });
      tiles.forEach(([n, l], i) => {
        const a = ein(t, 15.2 + i * 0.45, 0.5);
        const col = i % 2, row = Math.floor(i / 2);
        const x1 = R - col * 474, y0 = 320 + row * 204;
        withAlpha(a, () => {
          rr(x1 - 450, y0 + (1 - a) * 20, 450, 180, 20, { fill: C.base, stroke: C.border });
          text(n, x1 - 36, y0 + 96 + (1 - a) * 20, { size: 80, weight: 700, dir: 'ltr' });
          text(l, x1 - 36, y0 + 148 + (1 - a) * 20, { size: 32, color: C.muted });
        });
      });
    });
  };
});

/* ═════════ 3 · connect 23-48 ═════════ */
scene('connect', 23, 48, [1, 'اتصل'], (t0, t1) => {
  const T1 = typer('/plugin marketplace add abdulrahmanaljebreen/syntropy-ai', 24.7, 20, 11, EV);
  const o1 = T1.t1 + 0.6; ev(T1.t1 + 0.25, 'enter'); ev(o1, 'tick', 0.7);
  const T2 = typer('/plugin install syntropy@syntropy-ai', o1 + 0.9, 19, 12, EV);
  const o2 = T2.t1 + 0.6; ev(T2.t1 + 0.25, 'enter'); ev(o2, 'chime', 0.55);
  const T3 = typer('npx skills add abdulrahmanaljebreen/syntropy-ai', 35.4, 21, 13, EV);
  ev(T3.t1 + 0.25, 'enter');
  const AG = ['Claude.ai', 'Cursor', 'Codex', 'ChatGPT', 'Gemini'];
  const cT = 38.6; AG.forEach((_, i) => ev(cT + i * 0.32, 'pop', 0.55));
  cap(23.6, 33.2, `في ${L('Claude Code')}: أمران فقط للتثبيت.`, 'In Claude Code: just two commands to install.');
  cap(34.0, 40.4, 'وفي الوكلاء الأخرى: أمر واحد.', 'In other agents: one command.');
  cap(41.0, 47.5, `ثم ابدأ رسالتك بكلمة ${L('syntropy:')}`, 'Then start your message with syntropy:');
  return t => {
    const shrink = easeInOutCubic(span(t, 33.4, 34.4));
    const TW = 1388, TH = 400;
    const k = lerp(1, 0.62, shrink);
    const tx = W / 2 - TW * k / 2, ty = lerp(200, 150, shrink);
    withAlpha(ein(t, 23.5, 0.6), () => {
      ctx.save(); ctx.translate(tx, ty); ctx.scale(k, k);
      terminal(0, 0, TW, TH, 'Claude Code');
      const x = 48;
      prompt(T1.at(t), x, 132, { t, caret: t < T1.t1 + 0.2 });
      withAlpha(ein(t, o1, 0.3), () => { check(x + 14, 182, 22, { color: C.dBrand, lw: 3, p: span(t, o1, o1 + 0.3) }); text('syntropy-ai marketplace added', x + 46, 192, { size: 28, family: MONO, dir: 'ltr', align: 'left', color: C.dMuted }); });
      if (t >= T2.t1 - 10 && t >= o1 + 0.9) prompt(T2.at(t), x, 262, { t, caret: t < T2.t1 + 0.2 });
      withAlpha(ein(t, o2, 0.3), () => { check(x + 14, 312, 22, { color: C.dBrand, lw: 3, p: span(t, o2, o2 + 0.3) }); text('syntropy installed · /syntropy is ready', x + 46, 322, { size: 28, family: MONO, dir: 'ltr', align: 'left', color: C.dMuted }); });
      ctx.restore();
    });
    // other agents
    withAlpha(ein(t, 34.6), () => {
      text('في الوكلاء الأخرى', W / 2, 482, { size: 32, color: C.muted, align: 'center', weight: 500 });
      const str = T3.at(t), size = 32, full = tw(T3.str, size, 400, MONO, 'ltr');
      const pw = full + 120, px = W / 2 - pw / 2;
      rr(px, 506, pw, 76, 38, { fill: C.base, stroke: C.border });
      text('$', px + 40, 556, { size, family: MONO, dir: 'ltr', align: 'left', color: C.brand, weight: 600 });
      const w = text(str, px + 76, 556, { size, family: MONO, dir: 'ltr', align: 'left' });
      if (t < T3.t1 + 0.3 && caretOn(t)) rr(px + 80 + w, 530, 16, 32, 2, { fill: C.ink, alpha: 0.8 });
    });
    const cw = 300, gap = 24, total = AG.length * cw + (AG.length - 1) * gap, x0 = W / 2 + total / 2;
    AG.forEach((name, i) => {
      const a = ein(t, cT + i * 0.32, 0.5);
      withAlpha(a, () => {
        const x = x0 - (i + 1) * cw - i * gap, y = 640 + (1 - a) * 24;
        const hl = ein(t, 41.2 + i * 0.25, 0.4);
        rr(x, y, cw, 140, 20, { fill: C.base, stroke: hl > 0.01 ? C.lg300 : C.border, lw: 2 });
        text(name, x + cw / 2, y + 62, { size: 38, weight: 600, align: 'center', dir: 'ltr' });
        withAlpha(hl, () => text('syntropy: …', x + cw / 2, y + 108, { size: 24, family: MONO, align: 'center', dir: 'ltr', color: C.brandDark }));
      });
    });
  };
});

/* ═════════ 4 · ask 48-83 ═════════ */
scene('ask', 48, 83, [2, 'اطلب'], (t0, t1) => {
  const REQ = '/syntropy شاشة جديدة لتفاصيل التوزيعات، الهدف: أقل تذاكر دعم';
  ev(49.1, 'click', 0.6);
  const TR = typer(REQ, 49.7, 17, 21, EV);
  const sendT = TR.t1 + 0.35; ev(sendT, 'enter');
  const STEPS = ['ماذا', 'لمن', 'أين', 'الهدف', 'الموجود', 'المخاطر'];
  const fromReq = [0, 3, 4];
  const reqT = sendT + 0.9; fromReq.forEach((s, i) => ev(reqT + i * 0.3, 'tick', 0.55));
  const QS = [
    { step: 1, q: 'لمن هذه الشاشة؟', chips: ['مستثمر فرد', 'مستثمر مؤهّل', 'مطوّر أو مُصدِر', 'فريق داخلي'], pick: 0 },
    { step: 2, q: 'أين ستظهر؟', chips: ['التطبيق، هاتف', 'التطبيق، جهاز لوحي', 'الويب', 'لوحة الإدارة'], pick: 0 },
    { step: 5, q: 'ما الذي على المحك؟', chips: ['حركة أموال', 'بيانات شخصية', 'إفصاح منظَّم', 'موعد نهائي', 'لا شيء'], pick: 0 },
  ];
  let qt = reqT + 1.4;
  QS.forEach(Q => { Q.in = qt; Q.sel = qt + 2.2; Q.done = Q.sel + 0.5; Q.out = Q.sel + 0.95; ev(Q.in, 'pop', 0.5); ev(Q.sel, 'click', 0.7); ev(Q.done, 'tick', 0.6); qt = Q.out + 0.4; });
  const stepDone = {}; fromReq.forEach((s, i) => stepDone[s] = { t: reqT + i * 0.3, req: true });
  QS.forEach(Q => stepDone[Q.step] = { t: Q.done, req: false });
  const briefT = qt + 0.1; ev(briefT, 'whoosh', 0.3);
  const BRIEF = [['ماذا:', 'شاشة جديدة لتفاصيل التوزيعات'], ['لمن:', 'المستثمر الفرد'], ['أين:', 'التطبيق على الهاتف'], ['الهدف:', 'أقل تذاكر دعم عن التوزيعات'], ['المخاطر:', 'حركة أموال، والإفصاح بجانب كل رقم']];
  BRIEF.forEach((_, i) => ev(briefT + 0.5 + i * 0.45, 'pop', 0.4));

  function outLine(s, x, y, size) {
    const m = s.match(/^(\S+:\d+:\d+) (error|warning) (\S+) (.*)$/);

    const mv = easeInOutCubic(span(t, 153.0, 154.0));

      withAlpha(ein(t, sumT, 0.25), () => text(SUM1, 136, 546 + 4 * 42 + 6, { size: 20, family: MONO, dir: 'ltr', align: 'left', color: C.dError, weight: 600 }));

    });
    ctx.restore();
    // self-review checklist
    withAlpha(ein(t, 153.6, 0.5), () => {

        circle(x1 - 70, y - 12, 26, { fill: d > 0 ? C.brand : C.base, stroke: d > 0 ? C.brand : C.border, lw: 2 });

        text(sub, x1 - 120, y + 42, { size: 26, color: C.muted, dir: /^[A-Z]/.test(sub) ? 'ltr' : 'rtl' });

  };
});

    else { line(cx - 12, cy - 18, cx - 12, cy + 20, { color: C.brandDark, lw: 3 }); ctx.save(); ctx.globalAlpha = A; ctx.fillStyle = C.brandDark; ctx.beginPath(); ctx.moveTo(cx - 12, cy - 18); ctx.lineTo(cx + 16, cy - 10); ctx.lineTo(cx - 12, cy - 2); ctx.closePath(); ctx.fill(); ctx.restore(); }

/* ── frame ─────────────────────────────────────────────────────────────── */
function drawCaption(t) {
  if (q.get('caps') === '0') return; // clean frames for stills and teasers
  for (const c of CAPS) {
    if (!c.draw || t < c.t0 - 0.05 || t > c.t1 + 0.05) continue;
    const a = ein(t, c.t0, 0.35) * eout(t, c.t1, 0.35);
    withAlpha(a, () => text(c.ar, W / 2, H - 118 + (1 - ein(t, c.t0, 0.35)) * 10, { size: 50, weight: 500, align: 'center' }));
  }
}
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.fillStyle = C.surface; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  for (const s of SCENES) {
    if (t < s.t0 || t >= s.t1) continue;
    const a = ein(t, s.t0, 0.5) * eout(t, s.t1, 0.5);
    withAlpha(a, () => {
      if (s.chapter) chapterLabel(s.chapter[0], s.chapter[1], 1);
      s.draw(t);
    });
  }
  drawCaption(t);
}

]).then(() => { renderFrame(0); window.__ready = true; }, e => { console.error(String(e)); });
